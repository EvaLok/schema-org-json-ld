[package]
name = "v2-gardening-sweep"
version = "0.1.0"
edition = "2021"
description = "Axis 10 deslop pass for v2 redesign: stale-detection (file mtime older than threshold) + dead-link-detection (broken markdown [text](path) and wiki [[name]] references). SCAFFOLD: golden-path implementations of both detectors with JSON+text output; cycle 131 first-shape measurement crate for entropy-mitigation."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
