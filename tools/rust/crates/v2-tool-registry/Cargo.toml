[package]
name = "v2-tool-registry"
version = "0.1.0"
edition = "2021"
description = "Enumerate Rust tools under tools/rust/crates/ for orchestrator discovery (v2 redesign prototype)"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
