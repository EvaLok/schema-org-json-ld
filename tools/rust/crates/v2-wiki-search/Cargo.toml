[package]
name = "v2-wiki-search"
version = "0.1.0"
edition = "2021"
description = "Top-k retrieval over _notes/*.md corpus (v2 redesign prototype scaffold; cluster B sub-shape 6 PARTIAL — wiki + search memory substrate). Scaffold-partial: simple-substring ranking with H1+body description-surrogate; TF-IDF ranking, index caching, and frontmatter parsing deferred."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
