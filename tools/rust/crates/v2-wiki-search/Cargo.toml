[package]
name = "v2-wiki-search"
version = "0.1.0"
edition = "2021"
description = "Top-k retrieval over _notes/*.md corpus (v2 redesign prototype; cluster B sub-shape 6). COMPLETE: TF-IDF ranking with sublinear TF and smoothed IDF; opt-in index caching with mtime+size invalidation; YAML-lite frontmatter parsing (title/description/tags); typed WarnKind classification for corruption-handling."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
