[package]
name = "v2-super-step-boundary"
version = "0.1.0"
edition = "2021"
description = "Super-step transition state machine for the v2 multi-agent orchestrator (Eva-named load-bearing primitive cycle 138). Tracks per-cycle role transitions (reconciler → planner → executor → curator), enforces ordering, and verifies channel-output presence at each super-step boundary."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
