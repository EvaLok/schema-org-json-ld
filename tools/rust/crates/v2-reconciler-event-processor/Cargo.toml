[package]
name = "v2-reconciler-event-processor"
version = "0.1.0"
edition = "2021"
description = "Polls cron-internal sources (input-from-eva / audit-repo cursor / dispatch-returns) and writes the inbound-channel for the v2 multi-agent orchestrator (Eva-named load-bearing primitive cycle 138; fourth of four multi-agent-topology primitives)"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
