[package]
name = "v2-prompt-contract-check"
version = "0.1.0"
edition = "2021"
description = "Verifies that v2 role prompts' output-contract declarations match v2-channel-router's required_payload_keys (cycle 147 implementation per cycle 146 design scope)"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.31"

[dev-dependencies]
tempfile = "3"
