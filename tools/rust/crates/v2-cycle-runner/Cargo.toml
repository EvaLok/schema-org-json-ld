[package]
name = "v2-cycle-runner"
version = "0.1.0"
edition = "2021"
description = "Conductor for the v2 multi-agent orchestrator: composes the 4 role-prompt sessions and the 4 v2-* primitives (channel-router, super-step-boundary, role-driver, reconciler-event-processor) into a single per-cycle execution. Cycle 149 design scope; cycle 150 entry (init subcommand)."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
